name: Portcullis register
description: >-
  Registers the flags in a portcullis.json file with a Portcullis environment
  and archives the ones this source no longer declares. A `context` object in
  the file declares this source's context fields for the project, and an `acl`
  object its access policy's subject and object shapes. The calling
  job needs `permissions: id-token: write` to authenticate with GitHub OIDC.
inputs:
  realm:
    description: Realm slug
    required: true
  project:
    description: Project slug
    required: true
  env:
    description: Environment slug
    required: true
  source:
    description: Name of this registering source, for example the service name
    required: true
  file:
    description: Path to the flag file
    required: false
    default: portcullis.json
  api:
    description: Portcullis API base URL
    required: false
    default: https://api.pc.evanion.com
runs:
  using: node24
  main: dist/index.js
